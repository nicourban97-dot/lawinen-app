name: OSM-Daten aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    paths:
      - "tools/osm-daten.mjs"
      - "tools/osm-lib.mjs"
      - "tools/osm-lib.test.mjs"
      - ".github/workflows/osm-daten.yml"
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock pngjs@7.0.0
      # No quotes: the shell expands the pattern; node --test only knows globs from Node 21 on.
      - run: node --test tools/*.test.mjs
      - run: node tools/osm-daten.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "keine Änderung"; else git commit -m "OSM-Daten aktualisiert"; git pull --rebase; git push; echo "changed=1" >> "$GITHUB_ENV"; fi
      # Pushes made with the workflow token do not start a Pages build on their own.
      - name: Pages neu bauen
        if: env.changed == '1'
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "Pages-Build konnte nicht angestoßen werden"
